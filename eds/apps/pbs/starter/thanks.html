<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thanks – Redirecting…</title>
  <meta http-equiv="refresh" content="3; url=./app.html"><!-- no-JS fallback -->
  <style>
    body{margin:0;height:100vh;display:grid;place-items:center;
         background:#0D1B2A;color:#fff;font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif}
    .card{background:#112436;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:28px;text-align:center}
    .muted{color:#bfeaff;font-size:13px;margin-top:6px}
  </style>
</head>
<body>
  <div class="card">
    <h1 style="margin:0 0 10px">Thanks!</h1>
    <p>The form was submitted successfully.</p>
    <p class="muted">You’ll be redirected to PBS in a moment…</p>
  </div>
  <script>
    try{
      localStorage.setItem('PBS_STARTER_SIGNED_UP','true');
      if(!localStorage.getItem('PBS_TRIAL_START')){
        localStorage.setItem('PBS_TRIAL_START', Date.now().toString());
      }
    }catch(e){}
    setTimeout(()=>{ window.location.href = './app.html'; }, 2500); // 2–3s delay
  </script>
</body>
</html>
